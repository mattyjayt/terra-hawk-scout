# Nav2 parameters for the TerraHawk Scout (ROS 2 Jazzy, Nav2 1.3.13).
# Base: /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml (1.3.13).
# Every value that differs from that file has a "# SCOUT:" comment with the reason.
# Values marked MEASURE come from Task 11.1; replace them with your numbers.
# Sections for servers we don't launch (route_server, docking_server,
# smoother_server, loopback_simulator) are left out on purpose.

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"        # SCOUT: our URDF has no base_footprint; base_link is on the floor
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0             # SCOUT: RPLIDAR C1 range (default 100.0)
    laser_min_range: 0.05             # SCOUT: C1 minimum range; also drops hits on our own cables (default -1.0)
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 1000               # SCOUT: one small room, Pi 5 CPU (default 2000)
    min_particles: 200                # SCOUT: (default 500)
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.15                # SCOUT: slow robot; update after 0.15 rad of turning (default 0.2)
    update_min_d: 0.10                # SCOUT: update after 10 cm, not 25 cm (default 0.25)
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true            # SCOUT: every run starts at HOME, so AMCL needs no click (default false)
    initial_pose:                     # SCOUT: HOME in the map frame. MEASURE: copy "home" from waypoints.yaml
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered    # SCOUT: the EKF output from Lab 10 (default /odom)
    bt_loop_duration: 10
    default_server_timeout: 100       # SCOUT: ms a BT node waits for a server to accept a goal. 20 ms failed once in SIL on the busy Pi ("Timed out while waiting for action server to acknowledge goal request for follow_path") (default 20)
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Default trees (not set here): nav2_bt_navigator/behavior_trees/
    #   navigate_to_pose_w_replanning_and_recovery.xml
    #   navigate_through_poses_w_replanning_and_recovery.xml
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false     # SCOUT: plain Twist for the bridge (IF-ROS-TOPICS T1). Jazzy default is already false; set so a future default change can't break us
    odom_topic: /odometry/filtered    # SCOUT: (default odom)
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25  # SCOUT: slow robot in a small room (default 0.5)
      movement_time_allowance: 15.0   # SCOUT: 0.25 m at 0.15 m/s with turns and stalls (default 10.0)
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.07         # SCOUT: REQ-SCOUT-008 wants < 10 cm; the robot stops at the EDGE of this circle, so leave room for AMCL error (default 0.25)
      yaw_goal_tolerance: 0.12        # SCOUT: 7 deg, under REQ-SCOUT-008's 10 deg for the same reason (default 0.25)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"  # SCOUT: RPP, not MPPI (DD-SCOUT-NAV)
      desired_linear_vel: 0.15        # SCOUT: 30 % of v_max 0.5 (estimate); open loop, so stay slow (RPP default 0.5)
      lookahead_dist: 0.4             # SCOUT: short paths in a 4 x 3 m room (RPP default 0.6)
      min_lookahead_dist: 0.25        # SCOUT: (RPP default 0.3)
      max_lookahead_dist: 0.6         # SCOUT: (RPP default 0.9)
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0   # MEASURE: w_floor + 20 % (Task 11.1); below w_floor the skid steer stalls
      transform_tolerance: 0.2        # SCOUT: Pi 5 under load; TF can be a bit late (RPP default 0.1)
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.10   # MEASURE: v_floor (Task 11.1); never ask for less near the goal (RPP default 0.05)
      approach_velocity_scaling_dist: 0.4  # SCOUT: start slowing 0.4 m before the goal (RPP default 0.6)
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false   # keep off: near walls it would ask for speeds below v_floor
      regulated_linear_scaling_min_radius: 0.6   # SCOUT: (RPP default 0.9)
      regulated_linear_scaling_min_speed: 0.11   # MEASURE: max(v_floor, 0.11); docs: must be > 0.1; never regulate below what the motors can do (RPP default 0.25)
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_rotate_to_heading: true     # SCOUT: skid steer can turn in place; better than a wide arc in a small room
      allow_reversing: false          # must be false when use_rotate_to_heading is true
      rotate_to_heading_min_angle: 0.6     # SCOUT: rotate in place if the path is > 34 deg off (RPP default 0.785)
      max_angular_accel: 2.0          # SCOUT: (RPP default 3.2)
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      use_cancel_deceleration: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 2                        # SCOUT: 2 x 2 m is enough at 0.15 m/s (default 3)
      height: 2
      resolution: 0.05
      footprint: "[[0.116, 0.093], [0.116, -0.093], [-0.116, -0.093], [-0.116, 0.093]]"  # SCOUT: replaces robot_radius 0.22. x = plate/2, y = wheel_y + wheel_w/2 (Lab 6)
      footprint_padding: 0.01         # SCOUT: 1 cm margin
      plugins: ["obstacle_layer", "inflation_layer"]   # SCOUT: 2D LiDAR, so ObstacleLayer instead of VoxelLayer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0      # SCOUT: cost falls off faster, so narrow gaps stay usable (default 3.0)
        inflation_radius: 0.30        # SCOUT: ~2x our 0.15 m circumscribed radius (default 0.70)
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.116, 0.093], [0.116, -0.093], [-0.116, -0.093], [-0.116, 0.093]]"  # SCOUT: same as local
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0      # SCOUT: as local
        inflation_radius: 0.30        # SCOUT: as local
      always_send_full_costmap: true

map_server:
  ros__parameters:
    yaml_filename: ""                 # set by navigation.launch.py (map:=...)

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25                 # SCOUT: (default 0.5)
      use_astar: false
      allow_unknown: false            # SCOUT: never plan through unmapped space (default true)

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false     # SCOUT: plain Twist, as controller_server
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]   # SCOUT: no assisted_teleop
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2          # SCOUT: as RPP (default 0.1)
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5           # SCOUT: (default 1.0)
    min_rotational_vel: 1.0           # MEASURE: w_floor; Spin below it just hums (default 0.4)
    rotational_acc_lim: 2.0           # SCOUT: (default 3.2)

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false     # SCOUT: plain Twist in and out
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"             # no encoders: smooth against the last command, not measured speed
    max_velocity: [0.20, 0.0, 1.5]    # SCOUT: hard ceiling under the bridge clamps 0.3 / 1.5 (default [0.5, 0.0, 2.0])
    min_velocity: [-0.15, 0.0, -1.5]  # SCOUT: -0.15 lets the BackUp recovery (0.15 m/s) through (default [-0.5, 0.0, -2.0])
    max_accel: [0.6, 0.0, 2.5]        # SCOUT: gentle starts; TT motors slip on carpet (default [2.5, 0.0, 3.2])
    max_decel: [-0.8, 0.0, -2.5]      # SCOUT: (default [-2.5, 0.0, -3.2])
    odom_topic: "odometry/filtered"   # SCOUT: only used in CLOSED_LOOP; kept consistent (default odom)
    odom_duration: 0.1
    deadband_velocity: [0.02, 0.0, 0.05]   # SCOUT: tiny leftovers are sent as 0; the bridge would round them UP to pwm_min (default [0.0, 0.0, 0.0])
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false     # SCOUT: plain Twist out on /cmd_vel to the bridge
    base_frame_id: "base_link"        # SCOUT: no base_footprint (default base_footprint)
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["StopFront", "FootprintApproach"]   # SCOUT: added StopFront (REQ-SCOUT-009)
    StopFront:                        # SCOUT: REQ-SCOUT-009, stop if something is < ~10 cm ahead of the bumper
      type: "polygon"
      points: "[[0.23, 0.10], [0.23, -0.10], [0.12, -0.10], [0.12, 0.10]]"
      action_type: "stop"
      min_points: 3
      visualize: true
      polygon_pub_topic: "polygon_stop_front"
      enabled: true
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: true