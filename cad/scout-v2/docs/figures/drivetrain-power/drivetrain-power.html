class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>3 Skid steer: in a turn the tyres scrub sideways, so the wheels run as if the track were 1.7–1.9 × the 124 mm geometric one. Wheel odometry is good for distance, bad for heading: the EKF takes yaw from the MPU-6050 gyro</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>4 Loop: ESP32 counts with PCNT and runs the wheel PID at ≥ 50 Hz (20 ms); no /cmd_vel for 300 ms → MDD3A inputs LOW/LOW: braked to a stop in 0.16–0.19 s (coasting takes 0.32–0.42 s)</span></span><span class="iso-caption">Scout v2's left side with the near half of the top deck cut away (the parts it carries stay in place) and the near front wheel laid on the bench. The tour drives straight at 0.3 m/s (1.47 wheel turns, about 1481 counts per second), then turns left at 0.5 rad/s with 0.2 m/s forward: the near wheels slow to 0.14 m/s and the far ones speed up to 0.26 m/s, because the scrubbing tyres need an effective track about 1.8 × 124 mm. Read through the geometric track those wheel speeds claim 0.90 rad/s, so heading comes from the gyro. Then /cmd_vel goes quiet: after 300 ms the ESP32 drives both MDD3A inputs LOW and the motors brake. Hold the figure to cut /cmd_vel yourself. The encoder magnet is drawn turning 3 × the wheel; the real one turns 42 ×. The 1008-count figure is Hiwonder's claim (one buyer measured 600): measure it on arrival. The MPU-6050 hangs under the top deck between the driver and the buck. The right-side wiring, the I²C lead and the LiDAR tower are left out; layout after CAD r1, with the fuse holder moved beside the XT30 so the series path is in view.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
